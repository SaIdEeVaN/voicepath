name: Refresh the offices snapshot

# The map's "Places that can help" -- ITIs and training centres, employment and
# government offices, banks -- are served from backend/app/data/support_places.json
# for every search around a town the map knows. The public Overpass servers are
# volunteer-run and were unreachable from both the deployed backend and the
# build sandbox on 2026-11-03, so the data is fetched here, on GitHub's
# network, and committed straight to main -- the same way every other change
# lands here. Pushing to main redeploys the backend, which then serves it.
#
# Nothing unchecked reaches main: the snapshot must pass
# tests/test_bundled_snapshot.py with REQUIRE_SNAPSHOT=1 (and the map's own
# tests) before it is committed, and an unchanged snapshot is not committed.

on:
  workflow_dispatch:
    inputs:
      towns:
        description: "Comma-separated towns to refetch (empty = every town the map knows)"
        required: false
        default: ""
  schedule:
    # 02:41 UTC on the 3rd of each month. Offices move rarely; monthly is plenty.
    - cron: "41 2 3 * *"

permissions:
  contents: write

concurrency:
  group: refresh-offices
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned: ubuntu-latest became 26.04 in November 2026, which has no
    # build of Python 3.11.9 -- the version in backend/.python-version and
    # the one Render runs. The first run failed in setup-python on that.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Fetch offices from OpenStreetMap
        id: fetch
        env:
          TOWNS: ${{ inputs.towns }}
          DATABASE_URL: ""
          PLACES_PROVIDER: overpass
        run: |
          set +e
          if [ -n "$TOWNS" ]; then
            python -m app.scripts.fetch_support_places --towns "$TOWNS"
          else
            python -m app.scripts.fetch_support_places
          fi
          status=$?
          # Exit 1 means some towns could not be fetched. They are recorded as
          # not fetched, and the API does not claim to cover them, so a partial
          # snapshot is still worth proposing -- the PR says which are missing.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo "partial=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check the snapshot before committing it
        env:
          REQUIRE_SNAPSHOT: "1"
        run: python -m pytest -q tests/test_bundled_snapshot.py tests/test_nearby.py

      - name: Commit the snapshot to main if anything changed
        env:
          PARTIAL: ${{ steps.fetch.outputs.partial }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          file=app/data/support_places.json
          if [ -z "$(git status --porcelain -- "$file")" ]; then
            echo "The snapshot is unchanged; nothing to commit."
            exit 0
          fi

          summary=$(python - <<'EOF'
          import json
          d = json.load(open("app/data/support_places.json", encoding="utf-8"))
          towns = d["towns"]
          done = sorted(k for k, v in towns.items() if v.get("fetched"))
          missing = sorted(k for k, v in towns.items() if not v.get("fetched"))
          print(f"{len(d['elements'])} offices, as of {d['as_of']}.")
          print(f"Towns fetched ({len(done)}/{len(towns)}): {', '.join(done) or 'none'}.")
          if missing:
              print(f"Not fetched (searches there still go live): {', '.join(missing)}.")
          EOF
          )

          title="Refresh the offices snapshot from OpenStreetMap"
          [ "$PARTIAL" = "true" ] && title="$title (some towns missing)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "$title" -m "$summary" \
            -m "Fetched by the 'Refresh the offices snapshot' workflow. OpenStreetMap data, ODbL, (c) OpenStreetMap contributors. Checked by tests/test_bundled_snapshot.py with REQUIRE_SNAPSHOT=1."
          # main may have moved while the fetch ran (it takes a while).
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "$summary"
